<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Stajl Home</title>

<style>
  :root { --stran:#f4f3f1; --plosca:#e9e8e5; --crta:#cfcdc8; --tekst:#2b2a28; --siva:#8d8a84;
          --aktivno:#3a3836; --les:#a0784e; --napaka:#a3442f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--stran); color:var(--tekst);
         font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  .ozadje { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.6; }
  .ovoj { position:relative; z-index:1; max-width:560px; margin:0 auto;
          padding:calc(14px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom)); }

  /* glava */
  .vrh { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:44px; margin-bottom:6px; }
  .vrh .levo { justify-self:start; } .vrh .desno { justify-self:end; }
  .vrh img { height:26px; display:block; }
  .tg { background:none; border:0; font:inherit; color:var(--tekst); padding:8px 0; cursor:pointer; font-size:12px;
        letter-spacing:.14em; text-transform:uppercase; }
  .tg.puscica { font-size:22px; letter-spacing:0; text-transform:none; }
  .jezik { font-size:12px; letter-spacing:.14em; color:var(--siva); }
  .jezik button { background:none; border:0; font:inherit; color:var(--siva); padding:6px 3px; cursor:pointer; }
  .jezik button.izbran { color:var(--tekst); text-decoration:underline; text-underline-offset:4px; }

  /* tipografija */
  h1 { font-weight:300; font-size:30px; margin:18px 0 4px; letter-spacing:-.01em; }
  .podnaslov { color:var(--siva); font-size:14px; margin-bottom:22px; }
  .oznaka { font-size:11px; color:var(--siva); letter-spacing:.16em; text-transform:uppercase; margin:22px 0 10px; }
  .pod { font-size:12px; color:var(--siva); letter-spacing:.06em; padding:10px 0; border-top:1px solid var(--crta); border-bottom:1px solid var(--crta); margin:6px 0 4px; }
  .pod b { color:var(--tekst); font-weight:500; }

  /* gumbi */
  .gl { width:100%; font:inherit; font-size:13px; letter-spacing:.14em; text-transform:uppercase; padding:16px; border:0;
        border-radius:999px; background:var(--aktivno); color:#f4f3f1; cursor:pointer; margin-top:10px; }
  .gl:disabled { opacity:.5; }
  .sek { width:100%; font:inherit; font-size:13px; letter-spacing:.14em; text-transform:uppercase; padding:15px; border:1px solid var(--crta);
         border-radius:999px; background:transparent; color:var(--tekst); cursor:pointer; }
  .povezava { display:block; width:100%; background:none; border:0; font:inherit; font-size:14px; color:var(--siva); padding:12px 0 2px; cursor:pointer; text-align:center; }
  .povezava b { color:var(--tekst); font-weight:500; text-decoration:underline; text-underline-offset:3px; }
  .povezava.les { color:var(--les); }

  /* obrazci */
  form { display:flex; flex-direction:column; gap:4px; }
  label { font-size:11px; color:var(--siva); letter-spacing:.16em; text-transform:uppercase; margin-top:14px; }
  input:not([type=checkbox]) { font:inherit; font-size:17px; padding:10px 0; border:0; border-bottom:1px solid var(--crta);
          background:transparent; color:var(--tekst); border-radius:0; width:100%; }
  input:not([type=checkbox]):focus { outline:none; border-bottom-color:var(--tekst); }
  .potrditev { display:flex; align-items:center; gap:10px; font-size:14px; letter-spacing:0; text-transform:none; color:var(--tekst); margin:18px 0 4px; cursor:pointer; }
  .potrditev input { width:20px; height:20px; accent-color:var(--aktivno); margin:0; }
  .sporocilo { font-size:13px; padding:10px 14px; border-left:2px solid var(--les); background:rgba(160,120,78,.1); display:none; margin:8px 0; }
  .sporocilo.napaka { border-color:var(--napaka); background:rgba(163,68,47,.08); color:var(--napaka); }
  .sporocilo.vidno { display:block; }

  /* dobrodošlica */
  .dobro { min-height:calc(100vh - 46px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height:calc(100dvh - 46px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
           display:flex; flex-direction:column; justify-content:space-between; }
  .dobro .sredina { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .dobro .sredina img { width:170px; height:auto; }
  .dobro .geslo { letter-spacing:.16em; font-size:12px; text-transform:uppercase; color:#6b6862; margin-top:28px; }

  /* ploščice */
  .mreza { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .p { background:var(--plosca); border-radius:6px; padding:14px 14px 10px; min-height:150px; display:flex; flex-direction:column;
       justify-content:space-between; color:var(--tekst); user-select:none; transition:background .25s, color .25s; cursor:pointer; }
  .p .ik svg { width:38px; height:38px; display:block; }
  .p .ime { font-size:15px; padding:8px 0 6px; border-top:1px dotted var(--crta); border-bottom:1px dotted var(--crta); margin-top:18px; }
  .p .spodaj { display:flex; justify-content:space-between; align-items:center; padding-top:8px; min-height:34px; }
  .p .vr { font-size:12px; color:var(--siva); letter-spacing:.06em; }
  .gumbi { display:flex; gap:8px; }
  .g { width:30px; height:30px; border-radius:50%; border:1px solid var(--crta); background:transparent;
       color:inherit; font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .p.on { background:var(--aktivno); color:#f4f3f1; }
  .p.on .ime { border-color:#5b5855; } .p.on .vr { color:#d9c2a6; } .p.on .g { border-color:#6a6764; }
  .sc .tocka { width:22px; height:22px; border-radius:50%; border:1px solid var(--crta); position:relative; }
  .sc .tocka::after { content:''; position:absolute; inset:6px; border-radius:50%; background:var(--les); opacity:0; transition:opacity .2s; }
  .sc.blisk .tocka::after { opacity:1; }

  .dom { background:var(--plosca); border-radius:6px; padding:18px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; cursor:pointer; }
  .dom .im { font-size:18px; font-weight:300; } .dom .st { font-size:11px; color:var(--siva); margin-top:6px; letter-spacing:.1em; text-transform:uppercase; }
  .dom .pus { color:var(--siva); font-size:20px; }
  .pika { display:inline-block; width:6px; height:6px; border-radius:50%; background:#c9c6c0; margin-right:7px; vertical-align:1px; }
  .pika.ok { background:var(--les); }
  .stanje { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--siva); }

  .izhod { background:var(--plosca); border-radius:6px; padding:14px; margin-bottom:4px; }
  .izhod .gl-vrsta { display:flex; justify-content:space-between; align-items:center; }
  .izhod .oz { font-size:11px; color:var(--siva); letter-spacing:.16em; text-transform:uppercase; }
  .cipi { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .cip { font:inherit; font-size:12px; padding:7px 12px; border:1px solid var(--crta); border-radius:999px; background:transparent; color:var(--tekst); cursor:pointer; }
  .cip.izbran { background:var(--aktivno); color:#f4f3f1; border-color:var(--aktivno); }
  .mali { font:inherit; font-size:11px; letter-spacing:.12em; text-transform:uppercase; padding:7px 12px; border:1px solid var(--les); border-radius:999px; background:transparent; color:var(--les); cursor:pointer; }

  .p { position:relative; }
  .p .vec { position:absolute; top:8px; right:8px; width:34px; height:34px; border:0; background:transparent; color:inherit; opacity:.55; font-size:18px; cursor:pointer; }
  .stikalo { width:56px; height:32px; border-radius:16px; background:var(--crta); position:relative; border:0; transition:background .2s; cursor:pointer; flex:none; }
  .stikalo::after { content:''; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .2s; }
  .stikalo.on { background:var(--aktivno); } .stikalo.on::after { left:27px; }
  .velika { background:var(--plosca); border-radius:6px; padding:22px 18px; }
  .velika .vrsta { display:flex; justify-content:space-between; align-items:center; }
  .velika .odst { font-size:44px; font-weight:200; letter-spacing:-.02em; }
  input[type=range] { width:100%; margin:18px 0 4px; accent-color:var(--aktivno); height:30px; padding:0; border:0; }
  .urnik { display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--plosca); border-radius:6px; padding:14px 16px; margin-bottom:4px; }
  .urnik .cas { font-size:22px; font-weight:300; }
  .urnik .opis { font-size:11px; color:var(--siva); letter-spacing:.1em; text-transform:uppercase; margin-top:3px; }
  .urnik .x { background:none; border:0; color:var(--siva); font-size:20px; cursor:pointer; padding:4px 6px; }
  .urnik.ne { opacity:.5; }
  .obrazec-urnik { background:var(--plosca); border-radius:6px; padding:16px; margin-top:4px; }
  input[type=time] { font-size:28px !important; font-weight:300; }
  .prazno { color:var(--siva); font-size:14px; padding:26px 0; text-align:center; grid-column:1 / -1; line-height:1.5; }
  .noga { font-size:11px; color:#aaa7a1; text-align:center; margin-top:22px; letter-spacing:.06em; }
  .noga a { color:inherit; }
  .znamka { font-size:12px; color:var(--siva); letter-spacing:.04em; padding:2px 0 4px; }
  .socialno { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .soc { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; font:inherit; font-size:15px; padding:14px; border-radius:999px; cursor:pointer; }
  .soc svg { width:18px; height:18px; flex:none; }
  .soc.apple { background:#000; color:#fff; border:0; }
  .soc.google { background:#fff; color:#2b2a28; border:1px solid var(--crta); }
  .ali { display:flex; align-items:center; gap:12px; color:var(--siva); font-size:11px; letter-spacing:.16em; text-transform:uppercase; margin:22px 0 4px; }
  .ali::before, .ali::after { content:''; flex:1; height:1px; background:var(--crta); }
  .geslo-ovoj { position:relative; }
  .geslo-ovoj input { padding-right:44px !important; }
  .oko { position:absolute; right:0; bottom:6px; background:none; border:0; color:var(--siva); padding:6px; cursor:pointer; }
  .oko svg { width:20px; height:20px; display:block; }
  .namig { font-size:12px; color:var(--siva); margin-top:6px; }
  .namig.opozorilo { color:var(--napaka); }
  .skrito { display:none !important; }
  .razdelek { border-top:1px solid var(--crta); padding-top:6px; margin-top:22px; }
  .stolpec { display:flex; flex-direction:column; gap:10px; }
</style>
</head>
<body>
<svg class="ozadje" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#cdbda8" stroke-width="1">
    <path d="M-40 70 C 80 10, 160 130, 260 60 S 420 10, 460 90"/>
    <path d="M-40 110 C 70 50, 170 170, 270 100 S 420 60, 460 135"/>
    <path d="M-40 155 C 60 100, 180 210, 280 145 S 420 110, 460 180"/>
    <path d="M-40 620 C 90 580, 150 700, 250 650 S 410 580, 460 660"/>
    <path d="M-40 665 C 80 625, 160 750, 260 695 S 410 630, 460 708"/>
    <path d="M-40 710 C 70 670, 170 800, 270 740 S 410 680, 460 756"/>
    <path d="M-40 755 C 60 715, 180 850, 280 785 S 410 730, 460 804"/>

</svg>
<div class="ovoj">
  <div class="znamka skrito" id="znamka">Stajl Home</div>

  <!-- DOBRODOŠLICA -->
  <section id="v-dobro" class="skrito">
    <div class="vrh"><span class="levo"></span><span></span><span class="desno jezik" data-jezik></span></div>
    <div class="dobro">
      <div class="sredina">
        <img src="logo-stajl.png" alt="Stajl">
        <div class="geslo">Light, crafted for your home</div>
      </div>
      <div>
        <div class="sporocilo" id="dobro-sporocilo"></div>
        <button class="gl" id="b-zacni-reg" data-t="ustvari"></button>
        <button class="povezava" id="b-zacni-prijava" data-t-html="zePrijava"></button>
        <div class="noga"><a href="zasebnost.html" data-t="zasebnost"></a></div>
      </div>
    </div>
  </section>

  <!-- PRIJAVA / REGISTRACIJA -->
  <section id="v-prijava" class="skrito">
    <div class="vrh"><button class="tg puscica levo" id="b-nazaj-dobro" data-t-aria="nazaj">←</button><img src="logo-mono.png" alt="Stajl"><span class="desno jezik" data-jezik></span></div>
    <h1 id="prijava-naslov"></h1>
    <div class="podnaslov" id="prijava-pod"></div>
    <div class="sporocilo" id="prijava-sporocilo"></div>
    <div class="socialno">
      <button class="soc apple" id="b-apple" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.86-3.59 2.17-1.53 2.65-.39 6.58 1.1 8.73.73 1.05 1.6 2.23 2.73 2.19 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.4 1.2-2.46-.03-.01-2.3-.88-2.3-3.49zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.69-.92 2.69.97.07 1.96-.49 2.56-1.24z"/></svg><span data-t="zApple"></span></button>
      <button class="soc google" id="b-google" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.56-5.17 3.56-8.65z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.9l-3.88-3c-1.08.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.28v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.29 14.3a7.2 7.2 0 0 1 0-4.6V6.6H1.28a12 12 0 0 0 0 10.8l4.01-3.1z"/><path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.44-3.44A11.5 11.5 0 0 0 12 0 12 12 0 0 0 1.28 6.6l4.01 3.1C6.23 6.86 8.88 4.75 12 4.75z"/></svg><span data-t="zGoogle"></span></button>
    </div>
    <div class="ali" data-t="aliEposta"></div>
    <form id="f-prijava" novalidate>
      <label for="email" data-t="eposta"></label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required>
      <label for="geslo" data-t="geslo"></label>
      <div class="geslo-ovoj">
        <input id="geslo" type="password" autocomplete="current-password" minlength="8" required>
        <button class="oko" id="b-oko" type="button" data-t-aria="pokaziGeslo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="namig" id="geslo-namig"></div>
      <button class="povezava les" id="b-pozabljeno" type="button" data-t="pozabljeno" style="text-align:right; padding-top:6px"></button>
      <label class="potrditev" id="vrsta-ostani"><input type="checkbox" id="ostani" checked><span data-t="ostani"></span></label>
      <button class="gl" id="b-prijava" type="submit"></button>
    </form>
    <button class="povezava" id="b-preklopi"></button>
    <div class="noga"><span data-t="euPodatki"></span><br><a href="zasebnost.html" data-t="zasebnost"></a></div>
  </section>

  <!-- NOVO GESLO -->
  <section id="v-novogeslo" class="skrito">
    <div class="vrh"><span class="levo"></span><img src="logo-mono.png" alt="Stajl"><span class="desno jezik" data-jezik></span></div>
    <h1 data-t="novoGeslo"></h1>
    <div class="podnaslov" data-t="novoGesloPod"></div>
    <div class="sporocilo" id="novogeslo-sporocilo"></div>
    <form id="f-novogeslo" novalidate>
      <label for="geslo2" data-t="geslo"></label>
      <input id="geslo2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="gl" type="submit" data-t="shraniGeslo"></button>
    </form>
  </section>

  <!-- MOJI DOMOVI -->
  <section id="v-domovi" class="skrito">
    <div class="vrh"><span class="levo"></span><img src="logo-mono.png" alt="Stajl"><button class="tg desno" id="b-nastavitve" data-t="nastavitve"></button></div>
    <h1 data-t="mojiDomovi"></h1>
    <div class="podnaslov" id="domovi-pod"></div>
    <div id="seznam-domov"></div>
    <button class="sek" id="b-demo" style="margin-top:10px" data-t="demo"></button>
    <div class="razdelek">
      <div class="oznaka" data-t="dodajLuc"></div>
      <div class="sporocilo" id="dodaj-sporocilo"></div>
      <form id="f-dodaj" novalidate>
        <label for="koda" data-t="kodaNalepke"></label>
        <input id="koda" autocomplete="off" autocapitalize="characters" maxlength="12" data-t-ph="kodaPrimer">
        <button class="gl" type="submit" data-t="dodaj"></button>
      </form>
      <div class="noga" data-t="skenirajNasvet"></div>
    </div>
  </section>

  <!-- NAPRAVA -->
  <section id="v-naprava" class="skrito">
    <div class="vrh"><button class="tg puscica levo" id="b-nazaj" data-t-aria="nazaj">←</button><img src="logo-mono.png" alt="Stajl"><span class="desno stanje"><span class="pika" id="pika"></span><span id="status"></span></span></div>
    <h1 id="naprava-ime"></h1>
    <div class="podnaslov" id="povzetek"></div>
    <div class="oznaka" data-t="luci"></div>
    <div class="mreza" id="cone"></div>
    <div class="oznaka" data-t="sceneNaslov"></div>
    <div class="mreza" id="scene"></div>
    <button class="povezava les" id="b-uredi" data-t="urediImena"></button>
  </section>

  <!-- LUČ (podrobnosti) -->
  <section id="v-luc" class="skrito">
    <div class="vrh"><button class="tg puscica levo" id="b-nazaj-podr" data-t-aria="nazaj">←</button><img src="logo-mono.png" alt="Stajl"><span class="desno"></span></div>
    <h1 id="luc-ime"></h1>
    <div class="podnaslov" id="luc-pod"></div>
    <div class="velika">
      <div class="vrsta"><span class="odst" id="luc-odst"></span><button class="stikalo" id="luc-stikalo" data-t-aria="prizgiUgasni"></button></div>
      <input type="range" id="luc-drsnik" min="1" max="100" value="100" data-t-aria="svetlost">
    </div>
    <div class="oznaka" data-t="urnik"></div>
    <div id="seznam-urnikov"></div>
    <button class="sek" id="b-nov-urnik" data-t="dodajUrnik"></button>
    <div class="obrazec-urnik skrito" id="obrazec-urnik">
      <div class="sporocilo" id="urnik-sporocilo"></div>
      <label for="urnik-ura" data-t="ura"></label>
      <input type="time" id="urnik-ura" value="07:00">
      <label data-t="dnevi"></label>
      <div class="cipi" id="urnik-dnevi"></div>
      <label data-t="dejanje"></label>
      <div class="cipi" id="urnik-dejanje"></div>
      <div id="urnik-svetlost-vrsta"><label for="urnik-svetlost"><span data-t="svetlost"></span> <span id="urnik-svetlost-odst"></span></label>
      <input type="range" id="urnik-svetlost" min="1" max="100" value="80"></div>
      <label data-t="postopno"></label>
      <div class="cipi" id="urnik-trajanje"></div>
      <button class="gl" id="b-shrani-urnik" data-t="shrani"></button>
      <button class="povezava" id="b-preklici-urnik" data-t="preklici"></button>
    </div>
    <div class="noga" data-t="urnikNasvet"></div>
  </section>

  <!-- NOVA LUČ -->
  <section id="v-novaluc" class="skrito">
    <div class="vrh"><button class="tg puscica levo" id="b-nazaj-luc" data-t-aria="nazaj">←</button><img src="logo-mono.png" alt="Stajl"><span class="desno jezik" data-jezik></span></div>
    <h1 data-t="novaLuc"></h1>
    <div class="podnaslov" data-t="novaLucPod"></div>
    <div class="sporocilo" id="novaluc-sporocilo"></div>
    <form id="f-novaluc" novalidate>

        nastaviNacin(false); pokazi('v-dobro');
        sporoci('dobro-sporocilo', kodaCaka() ? t('kodaCaka') : '');
        return;
      }
      if (dogodek === 'SIGNED_IN' && prej && prej.id === uporabnik.id) return;
      if (dogodek === 'SIGNED_IN' || dogodek === 'INITIAL_SESSION') {
        const k = vzemiKodo();
        if (k) { await obdelajKodo(k); } else if (!trenutna) { naloziDomove(); }
      }
    }, 0);
  });
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (_) {} }
})();
