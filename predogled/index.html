  function shraniKodo(k) { try { sessionStorage.setItem('stajl_koda', k); } catch (_) {} }

  $('f-prijava').onsubmit = async (e) => {

  // ---------- pozabljeno geslo: koda iz e-pošte (velja 2 min) ----------
  const VELJAVNOST_KODE = 120;
  let obnovaEmail = '', odstevalnik = null, menjamGeslo = false, zamikTimer = null;
  const ZAMIK_POSILJANJA = 60;
  function zazeniZamik() {

    const b = $('b-nova-koda'), b1 = $('b-poslji-kodo');
    const tik = () => {

      if (!ost) { clearInterval(zamikTimer); b.disabled = false; b1.disabled = false; b.textContent = t('posljiNovoKodo'); b1.textContent = t('posljiKodo'); return; }
      b.disabled = true; b1.disabled = true;
      b.textContent = t('posljiZnova', { s: ost }); b1.textContent = t('posljiZnova', { s: ost });
    };
    tik(); zamikTimer = setInterval(tik, 1000);
  }
  function korakObnove(k) {
    $('f-poslji-kodo').classList.toggle('skrito', k !== 1);

  function zazeniOdstevanje() {

  $('b-pozabljeno').onclick = () => {

  $('f-poslji-kodo').onsubmit = (e) => {

  $('b-nova-koda').onclick = () => posljiKodoObnove();
  $('b-nazaj-prijava').onclick = async () => { clearInterval(odstevalnik); if (menjamGeslo) { menjamGeslo = false; await sb.auth.signOut(); } nastaviNacin(false); pokazi('v-prijava'); };
  $('koda-obnova').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 8); };
  $('f-koda').onsubmit = async (e) => {

    clearInterval(odstevalnik); clearInterval(zamikTimer);

  // ---------- animacija dobrodošlice ----------
  function imeUporabnika(u) {
    const m = (u && u.user_metadata) || {};
    return m.ime || (m.full_name || m.name || '').split(' ')[0] || '';
  }
  function pozdravi(u) {
    return new Promise(resolve => {
      const el = $('pozdrav'); const ime = imeUporabnika(u);
      $('pozdrav-besedilo').textContent = ime ? t('dobrodosli', { ime }) : t('dobrodosliBrez');
      el.classList.add('vidno');
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('igra')));
      setTimeout(() => { resolve(); el.classList.remove('vidno'); }, 2100);
      setTimeout(() => el.classList.remove('igra'), 2700);
    });
  }

  // ---------- domovi, prostori, luči ----------
  function jeNaVoljo(d) { return !!d.demo || (d.last_seen && (Date.now() - new Date(d.last_seen).getTime()) < 20000); }
  let domovi = [], trenutniDom = null;
  function shraniDom(id) { trenutniDom = id; try { localStorage.setItem('stajl_dom', id); } catch (_) {} }
  let domoviObljuba = null;
  function naloziSeznamDomov() { if (!domoviObljuba) domoviObljuba = _naloziSeznamDomov().finally(() => { domoviObljuba = null; }); return domoviObljuba; }
  async function _naloziSeznamDomov() {
    let { data } = await sb.from('domovi').select('id,ime').order('created_at');
    if (!data || !data.length) {
      const r = await sb.from('domovi').insert({ ime: t('privzetiDom') }).select('id,ime');
      data = r.data || [];
    }
    domovi = data;
    let z = null; try { z = localStorage.getItem('stajl_dom'); } catch (_) {}
    if (!domovi.some(d => d.id === z)) z = domovi.length ? domovi[0].id : null;
    trenutniDom = z;
  }
  let naprave = {}, prostori = [], razpored = [], sceneDoma = [], trenutniProstor = null, urejamScene = false;
  const lokalno = {};
  const kljuc = (dev, ch) => dev + ':' + ch;
  function lociKljuc(k) { const i = k.lastIndexOf(':'); return { dev: k.slice(0, i), ch: +k.slice(i + 1) }; }
  function stanjeLuci(dev, ch) {
    const o = lokalno[kljuc(dev, ch)];
    if (o && Date.now() < o.do) return { on: o.on, b: o.b };
    const d = naprave[dev]; const s = d && d.state && (d.state[ch] || d.state[String(ch)]);
    return { on: !!(s && s.on), b: (s && s.b) || 100 };
  }
  function stanje(k) { const l = luci[k] || lociKljuc(k); return stanjeLuci(l.dev, l.ch); }
  function imeLuci(dev, ch) { const d = naprave[dev]; return d ? imeKanala(d, ch).ime : t('privzeto')[ch]; }
  function luciProstora(pid) { return razpored.filter(r => r.prostor_id === pid); }
  function luciDoma() { const ids = new Set(prostori.map(p => p.id)); return razpored.filter(r => ids.has(r.prostor_id)); }
  function gorijo(n) {
    if (jezik === 'en') return n === 1 ? t('gori1', { n }) : t('goriN', { n });
    const m = n % 100;
    return t(m === 1 ? 'gori1' : m === 2 ? 'gori2' : (m === 3 || m === 4) ? 'gori3' : 'goriN', { n });
  }
  function ikonaProstora(ime) {
    if (/kuhinj|kitchen/i.test(ime)) return 'kuhanje';
    if (/dnevn|living|lounge/i.test(ime)) return 'vecer';
    if (/spaln|bed|otrošk|otrosk/i.test(ime)) return 'noc';
    if (/garderob|omar|wardrobe/i.test(ime)) return 'omare';
    if (/kopal|bath/i.test(ime)) return 'notranjost';

  }
  function blisk(el) { el.classList.add('blisk'); setTimeout(() => el.classList.remove('blisk'), 700); }

  async function naloziPodatke() {
    if (!trenutniDom) await naloziSeznamDomov();

      sb.from('devices').select(IZBRANO),
      sb.from('prostori').select('id,dom_id,ime').eq('dom_id', trenutniDom).order('created_at'),
      sb.from('luci_prostorov').select('device_id,channel,prostor_id'),
      sb.from('scene_doma').select('id,ime,nastavi').eq('dom_id', trenutniDom).order('created_at')
    ]);
    if (nd.error) throw nd.error;
    if (pr.error) throw pr.error;
    naprave = {}; (nd.data || []).forEach(d => naprave[d.id] = d);
    prostori = pr.data || [];
    razpored = (rz.data || []).filter(r => naprave[r.device_id]);
    sceneDoma = sc.data || [];
  }
  async function osvezi() {
    const { data, error } = await sb.from('devices').select(IZBRANO);

    data.forEach(d => naprave[d.id] = d);
    osveziPrikaz();
  }
  function zazeniOsvezevanje() { clearInterval(osvezevanje); osvezevanje = setInterval(osvezi, 2500); }
  function osveziPrikaz() {

  async function naloziDomove(sporocilo) {
    trenutna = null; trenutniProstor = null;

    sporoci('dodaj-sporocilo', sporocilo || '');
    await naloziSeznamDomov();
    const dom = domovi.find(d => d.id === trenutniDom);
    $('dom-ime').textContent = dom ? dom.ime : t('privzetiDom');
    try { await naloziPodatke(); }
    catch (err) { $('seznam-prostorov').innerHTML = `<div class="prazno">${esc(prevedi(err))}</div>`; return; }
    narisiDom();
    zazeniOsvezevanje();
  }
  function narisiDom() {
    const el = $('seznam-prostorov'); el.innerHTML = '';
    prostori.forEach(p => {
      const div = document.createElement('div');
      div.className = 'p prostor'; div.dataset.pid = p.id;
      div.innerHTML = `<div class="ik">${svg(ikonaProstora(p.ime))}</div><div class="ime"></div><div class="spodaj"><span class="vr"></span></div>`;
      div.querySelector('.ime').textContent = p.ime;
      div.onclick = () => odpriProstor(p);
      el.appendChild(div);
    });
    $('oznaka-prostori').classList.toggle('skrito', !prostori.length);
    $('prazen-dom').classList.toggle('skrito', prostori.length > 0);
    narisiScene();
    const vse = luciDoma();
    $('b-demo').classList.toggle('skrito', !POKAZI_DEMO || vse.some(r => naprave[r.device_id] && naprave[r.device_id].demo));
    posodobiDom();
  }
  function posodobiDom() {
    const vse = luciDoma();
    const gori = vse.filter(r => stanjeLuci(r.device_id, r.channel).on).length;
    $('domovi-pod').textContent = vse.length ? (gori ? gorijo(gori) : t('vseUgasnjeno')) : '';
    $('seznam-prostorov').querySelectorAll('.prostor').forEach(div => {
      const l = luciProstora(div.dataset.pid);
      const n = l.filter(r => stanjeLuci(r.device_id, r.channel).on).length;
      div.classList.toggle('on', n > 0);
      div.querySelector('.vr').textContent = l.length ? (n ? gorijo(n) : t('ugasnjeno')) : t('brezLuci');
    });
  }
  function narisiScene() {
    const vse = luciDoma();
    const sc = $('scene-doma'); sc.innerHTML = '';
    $('vrsta-scene').classList.toggle('skrito', !vse.length);

    const cip = (ime, fn, cls) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'scena-cip' + (cls ? ' ' + cls : ''); b.textContent = ime;
      b.onclick = fn; sc.appendChild(b); return b;
    };
    if (!urejamScene) cip(t('vseUgasni'), (e) => { blisk(e.currentTarget); poslji(luciDoma().map(r => ({ dev: r.device_id, ch: r.channel, on: false }))); });
    sceneDoma.forEach(s => {
      const b = cip(s.ime, (e) => { if (urejamScene) return odpriSceno(s); blisk(e.currentTarget); uporabiSceno(s); }, urejamScene ? 'uredi' : '');
      let dolgo = null;
      b.addEventListener('pointerdown', () => { dolgo = setTimeout(() => { dolgo = 'odprto'; odpriSceno(s); }, 600); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { if (dolgo !== 'odprto') clearTimeout(dolgo); }));
    });
    cip('+ ' + t('scena'), () => odpriSceno(null), 'dodaj');
  }
  $('b-uredi-scene').onclick = () => { urejamScene = !urejamScene; narisiScene(); };

  async function ustvariProstor(ime) {
    const { data, error } = await sb.from('prostori').insert({ dom_id: trenutniDom, ime: ime.slice(0, 30) }).select('id,dom_id,ime');
    if (error || !data || !data[0]) throw (error || new Error('Prostor'));
    prostori.push(data[0]);
    return data[0];
  }
  async function dodeliLuci(dev, kanali, pid) {
    for (const ch of kanali) {
      await sb.from('luci_prostorov').delete().eq('device_id', dev).eq('channel', ch);
      await sb.from('luci_prostorov').insert({ device_id: dev, channel: ch, prostor_id: pid });
    }
  }
  async function dodeliNapravo(d) {
    let p = trenutniProstor;
    if (!p) p = await ustvariProstor(d.name || t('novProstor'));
    const kanali = imaImena(d) ? [0, 1, 2, 3].filter(i => d.channels[i]) : [0, 1, 2, 3];
    await dodeliLuci(d.id, kanali, p.id);
    await naloziPodatke();

    try { const u = new URL(besedilo); const k = u.searchParams.get('koda'); if (k) return k.trim().toUpperCase(); } catch (_) {}

  $('b-nazaj3').onclick = () => { if (poPrevzemu) naloziDomove(); else odpriNastavitve(); };

  // ---------- lastne scene doma ----------
  let urejanaScena = null, scenaNast = {};
  function odpriSceno(s) {
    urejanaScena = s;
    scenaNast = {};
    const vse = luciDoma();
    if (s) Object.entries(s.nastavi || {}).forEach(([k, v]) => { if (v > 0) scenaNast[k] = +v; });
    else vse.forEach(r => { const st = stanjeLuci(r.device_id, r.channel); if (st.on) scenaNast[kljuc(r.device_id, r.channel)] = st.b; });
    clearInterval(osvezevanje);
    pokazi('v-scena');
    $('scena-naslov').textContent = s ? t('urediSceno') : t('novaScena');
    $('scena-ime').value = s ? s.ime : '';
    $('b-scena-izbrisi').classList.toggle('skrito', !s);
    sporoci('scena-sporocilo', '');
    const el = $('scena-luci'); el.innerHTML = '';
    prostori.forEach(p => {
      const l = luciProstora(p.id);
      if (!l.length) return;
      const oz = document.createElement('div'); oz.className = 'oznaka'; oz.textContent = p.ime; el.appendChild(oz);
      l.forEach(r => {
        const k = kljuc(r.device_id, r.channel), ime = imeLuci(r.device_id, r.channel);
        const v = document.createElement('div'); v.className = 'sc-vrsta';
        v.innerHTML = `<div class="gl-vrsta"><span class="ime-l"></span><span class="odst"></span><button type="button" class="stikalo" role="switch"></button></div><input type="range" min="1" max="100" step="1">`;
        v.querySelector('.ime-l').textContent = ime; v.querySelector('.stikalo').setAttribute('aria-label', ime);
        const sw = v.querySelector('.stikalo'), rr = v.querySelector('input'), o = v.querySelector('.odst');
        const narisi = () => { const on = scenaNast[k] > 0; sw.classList.toggle('on', on); sw.setAttribute('aria-checked', on); v.classList.toggle('ugasnjena', !on); o.textContent = on ? scenaNast[k] + ' %' : t('ugasnjena'); rr.value = on ? scenaNast[k] : 60; };
        sw.onclick = () => { if (scenaNast[k] > 0) delete scenaNast[k]; else scenaNast[k] = +rr.value || 60; narisi(); };
        rr.oninput = () => { scenaNast[k] = +rr.value; narisi(); };
        narisi(); el.appendChild(v);
      });
    });
  }
  function polnaScena() {
    const n = {};
    luciDoma().forEach(r => { const k = kljuc(r.device_id, r.channel); n[k] = scenaNast[k] > 0 ? scenaNast[k] : 0; });
    return n;
  }
  $('b-nazaj-scena').onclick = () => naloziDomove();
  $('b-scena-preizkusi').onclick = () => uporabiSceno({ nastavi: polnaScena() });
  $('b-scena-shrani').onclick = async () => {
    const ime = $('scena-ime').value.trim();
    if (!ime) return sporoci('scena-sporocilo', t('eScenaIme'), true);
    if (!Object.keys(scenaNast).length) return sporoci('scena-sporocilo', t('eScenaLuc'), true);
    const nastavi = polnaScena();
    const { error } = urejanaScena
      ? await sb.from('scene_doma').update({ ime, nastavi }).eq('id', urejanaScena.id)
      : await sb.from('scene_doma').insert({ dom_id: trenutniDom, ime, nastavi });
    if (error) return sporoci('scena-sporocilo', prevedi(error), true);
    urejamScene = false;
    naloziDomove();
  };
  $('b-scena-izbrisi').onclick = async () => {
    if (!urejanaScena) return;
    await sb.from('scene_doma').delete().eq('id', urejanaScena.id);
    naloziDomove();
  };

  // ---------- podrobnosti luči in urnik ----------
  let odprtaLuc = null, drsnikCas = 0, drsnikTimer = null, urnikDnevi = [1, 2, 3, 4, 5, 6, 7], urnikPrizgi = true, urnikTrajanje = 0, urnikOdDo = false;
  function odpriLuc(k) {
    odprtaLuc = k;
    const l = luci[k];
    pokazi('v-luc');
    $('luc-ime').textContent = imeLuci(l.dev, l.ch);
    $('ime-luci-uredi').value = imeLuci(l.dev, l.ch);
    sporoci('luc-sporocilo', '');
    $('b-odstrani-luc').dataset.potrdi = ''; $('b-odstrani-luc').textContent = t('odstraniLuc');
    $('obrazec-urnik').classList.add('skrito'); $('b-nov-urnik').classList.remove('skrito');
    narisiLuc(); naloziUrnike(); narisiPremik();
    zazeniOsvezevanje();
  }
  function narisiLuc() {
    if (!odprtaLuc || !luci[odprtaLuc]) return;
    const s = stanje(odprtaLuc);
    $('luc-odst').textContent = s.on ? s.b + ' %' : t('lucUgasnjena');
    $('luc-stikalo').classList.toggle('on', s.on);
    if (document.activeElement !== $('luc-drsnik')) $('luc-drsnik').value = s.b || 100;
    $('luc-pod').textContent = trenutniProstor ? trenutniProstor.ime : '';
  }
  function narisiPremik() {
    const c = $('luc-prostori'); c.innerHTML = '';
    prostori.forEach(p => {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'cip' + (trenutniProstor && p.id === trenutniProstor.id ? ' izbran' : ''); b.textContent = p.ime;
      b.onclick = async () => {
        if (trenutniProstor && p.id === trenutniProstor.id) return;
        const l = luci[odprtaLuc];
        const { error } = await sb.from('luci_prostorov').update({ prostor_id: p.id }).eq('device_id', l.dev).eq('channel', l.ch);
        if (error) return sporoci('luc-sporocilo', prevedi(error), true);
        await naloziPodatke(); odpriProstor(prostori.find(x => x.id === p.id));
      };
      c.appendChild(b);
    });
  }
  $('b-shrani-ime-luci').onclick = async () => {
    const l = luci[odprtaLuc], d = naprave[l.dev];
    const ime = $('ime-luci-uredi').value.trim();
    if (!ime) return sporoci('luc-sporocilo', t('eImeLuci'), true);
    const imena = imaImena(d) ? d.channels.slice() : [null, null, null, null];
    imena[l.ch] = ime;
    const { error } = await sb.rpc('nastavi_kanale', { p_device: l.dev, p_kanali: imena });
    if (error) return sporoci('luc-sporocilo', prevedi(error), true);
    d.channels = imena; $('luc-ime').textContent = ime;
    sporoci('luc-sporocilo', t('imeShranjenoLuc'));
  };
  $('b-odstrani-luc').onclick = async (e) => {
    const b = e.currentTarget;
    if (!b.dataset.potrdi) { b.dataset.potrdi = '1'; b.textContent = t('resIzbrisi'); return; }
    b.dataset.potrdi = ''; b.textContent = t('odstraniLuc');
    const l = luci[odprtaLuc];
    await sb.from('luci_prostorov').delete().eq('device_id', l.dev).eq('channel', l.ch);
    await naloziPodatke(); odpriProstor(trenutniProstor);
  };
  $('luc-stikalo').onclick = () => { const l = luci[odprtaLuc], s = stanje(odprtaLuc); poslji([{ dev: l.dev, ch: l.ch, on: !s.on, b: s.on ? null : (s.b || 100) }]); };
  $('luc-drsnik').oninput = () => {
    const v = +$('luc-drsnik').value, l = luci[odprtaLuc]; $('luc-odst').textContent = v + ' %';
    clearTimeout(drsnikTimer);
    if (Date.now() - drsnikCas > 300) { drsnikCas = Date.now(); poslji([{ dev: l.dev, ch: l.ch, on: true, b: v }]); }
    else drsnikTimer = setTimeout(() => poslji([{ dev: l.dev, ch: l.ch, on: true, b: v }]), 320);
  };
  $('luc-drsnik').onchange = () => { const l = luci[odprtaLuc]; poslji([{ dev: l.dev, ch: l.ch, on: true, b: +$('luc-drsnik').value }]); };
  $('b-nazaj-podr').onclick = () => odpriProstor(trenutniProstor);

  function opisDni(d) {
    const s = [...d].sort().join(',');
    if (s === '1,2,3,4,5,6,7') return t('vsakDan');
    if (s === '1,2,3,4,5') return t('delavniki');
    if (s === '6,7') return t('vikend');
    return [...d].sort().map(x => t('dneviKratko')[x - 1]).join(' ');
  }
  async function naloziUrnike() {
    const el = $('seznam-urnikov');
    const { data, error } = await sb.from('urniki').select('id,ura,ura_do,dnevi,prizgi,svetlost,aktiven,trajanje').eq('device_id', luci[odprtaLuc].dev).eq('channel', luci[odprtaLuc].ch).order('ura');
    if (error) { el.innerHTML = `<div class="prazno">${esc(prevedi(error))}</div>`; return; }
    if (!data.length) { el.innerHTML = `<div class="prazno" style="padding:12px 0 16px">${esc(t('niUrnikov'))}</div>`; return; }
    el.innerHTML = '';
    data.forEach(u => {
      const r = document.createElement('div');
      r.className = 'urnik' + (u.aktiven ? '' : ' ne');
      const dej = (u.ura_do ? `${u.svetlost || 100} %` : (u.prizgi ? `${t('prizgi')} ${u.svetlost || 100} %` : t('ugasni'))) + (u.trajanje ? ' · ' + t('postopnoOpis', { n: Math.round(u.trajanje / 60) }) : '');
      const cas = u.ura_do ? t('okno', { od: u.ura.slice(0, 5), do: u.ura_do.slice(0, 5) }) : u.ura.slice(0, 5);
      r.innerHTML = `<div><div class="cas">${esc(cas)}</div><div class="opis">${esc(opisDni(u.dnevi))} · ${esc(dej)}</div></div>
        <div style="display:flex; align-items:center; gap:6px"><button class="stikalo ${u.aktiven ? 'on' : ''}" aria-label="${esc(t('prizgiUgasni'))}"></button><button class="x" aria-label="×">×</button></div>`;
      r.querySelector('.stikalo').onclick = async () => { await sb.from('urniki').update({ aktiven: !u.aktiven }).eq('id', u.id); naloziUrnike(); };
      r.querySelector('.x').onclick = async () => { await sb.from('urniki').delete().eq('id', u.id); naloziUrnike(); };
      el.appendChild(r);
    });
  }
  function narisiObrazecUrnika() {
    const d = $('urnik-dnevi'); d.innerHTML = '';
    t('dneviKratko').forEach((ime, x) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cip' + (urnikDnevi.includes(x + 1) ? ' izbran' : ''); b.textContent = ime;
      b.onclick = () => { urnikDnevi = urnikDnevi.includes(x + 1) ? urnikDnevi.filter(y => y !== x + 1) : urnikDnevi.concat(x + 1); narisiObrazecUrnika(); };
      d.appendChild(b);
    });
    const a = $('urnik-dejanje'); a.innerHTML = '';
    [['on', t('prizgi')], ['off', t('ugasni')], ['okno', t('odDo')]].forEach(([v, ime]) => {
      const izbran = v === 'okno' ? urnikOdDo : (!urnikOdDo && (v === 'on') === urnikPrizgi);
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cip' + (izbran ? ' izbran' : ''); b.textContent = ime;
      b.onclick = () => { urnikOdDo = v === 'okno'; urnikPrizgi = v !== 'off'; narisiObrazecUrnika(); };
      a.appendChild(b);
    });
    $('urnik-do-vrsta').classList.toggle('skrito', !urnikOdDo);
    const tr = $('urnik-trajanje'); tr.innerHTML = '';
    [0, 300, 900, 1800].forEach(v => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'cip' + (urnikTrajanje === v ? ' izbran' : '');
      b.textContent = v ? t('minN', { n: v / 60 }) : t('takoj');
      b.onclick = () => { urnikTrajanje = v; narisiObrazecUrnika(); };
      tr.appendChild(b);
    });
    $('urnik-svetlost-vrsta').classList.toggle('skrito', !urnikPrizgi);
    $('urnik-svetlost-odst').textContent = $('urnik-svetlost').value + ' %';
  }
  $('urnik-svetlost').oninput = () => { $('urnik-svetlost-odst').textContent = $('urnik-svetlost').value + ' %'; };
  $('b-nov-urnik').onclick = () => {
    urnikDnevi = [1, 2, 3, 4, 5, 6, 7]; urnikPrizgi = true; urnikTrajanje = 0; urnikOdDo = false; $('urnik-ura').value = '07:00'; $('urnik-svetlost').value = 80;
    sporoci('urnik-sporocilo', ''); narisiObrazecUrnika();
    $('obrazec-urnik').classList.remove('skrito'); $('b-nov-urnik').classList.add('skrito');
  };
  $('b-preklici-urnik').onclick = () => { $('obrazec-urnik').classList.add('skrito'); $('b-nov-urnik').classList.remove('skrito'); };
  $('b-shrani-urnik').onclick = async () => {
    if (!urnikDnevi.length) return sporoci('urnik-sporocilo', t('eDnevi'), true);
    const { error } = await sb.from('urniki').insert({
      device_id: luci[odprtaLuc].dev, channel: luci[odprtaLuc].ch, ura: $('urnik-ura').value || '07:00', dnevi: [...urnikDnevi].sort(),
      prizgi: urnikPrizgi, svetlost: urnikPrizgi ? +$('urnik-svetlost').value : null, trajanje: urnikTrajanje, ura_do: urnikOdDo ? ($('urnik-do').value || null) : null,
      tz: (Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Ljubljana')
    });
    if (error) return sporoci('urnik-sporocilo', prevedi(error), true);
    $('obrazec-urnik').classList.add('skrito'); $('b-nov-urnik').classList.remove('skrito');
    naloziUrnike();
  };

  // ---------- nastavitve ----------
  async function narisiNaprave() {
    const el = $('seznam-naprav'); el.innerHTML = '';
    const { data } = await sb.from('devices').select(IZBRANO).order('name');
    (data || []).forEach(d => { naprave[d.id] = d; });
    if (!data || !data.length) { el.innerHTML = `<div class="prazno" style="padding:8px 0">${esc(t('niNaprav'))}</div>`; return; }
    data.forEach(d => {
      const div = document.createElement('div'); div.className = 'dom';
      const st = d.demo ? t('demoStanje') : (jeNaVoljo(d) ? t('povezano') : t('niPovezana'));
      div.innerHTML = `<div><div class="im"></div><div class="st"><span class="pika ${jeNaVoljo(d) ? 'ok' : ''}"></span>${esc(st)}</div></div><div class="pus">›</div>`;
      div.querySelector('.im').textContent = d.name;
      div.onclick = () => odpriUreditev(d, false);
      el.appendChild(div);
    });
  }
  function odpriNastavitve() {
    pokazi('v-nastavitve');
    narisiNaprave();
    const m = (uporabnik && uporabnik.user_metadata) || {};
    $('moj-email').textContent = uporabnik ? uporabnik.email : '';
    $('n-ime').value = m.ime || ''; $('n-priimek').value = m.priimek || '';
    $('potrdi-izbris').classList.remove('vidno');
    sporoci('nast-sporocilo', '');
  };
  $('b-nastavitve').onclick = odpriNastavitve;
  $('b-shrani-ime').onclick = async () => {
    const ime = $('n-ime').value.trim(), priimek = $('n-priimek').value.trim();
    if (!ime || !priimek) return sporoci('nast-sporocilo', t('eIme'), true);
    const { data, error } = await sb.auth.updateUser({ data: { ime, priimek, full_name: ime + ' ' + priimek } });
    if (error) return sporoci('nast-sporocilo', prevedi(error), true);
    if (data && data.user) uporabnik = data.user;
    sporoci('nast-sporocilo', t('imeShranjeno'));
  };
  $('b-nazaj2').onclick = () => naloziDomove();
  $('b-odjava').onclick = async () => { await sb.auth.signOut(); };
  $('b-izbrisi').onclick = () => $('potrdi-izbris').classList.add('vidno');
  $('b-izbrisi-ne').onclick = () => $('potrdi-izbris').classList.remove('vidno');
  $('b-izbrisi-da').onclick = async () => {
    const { error } = await sb.rpc('izbrisi_moj_racun');
    if (error) return sporoci('nast-sporocilo', prevedi(error), true);
    await sb.auth.signOut();
  };

  // ---------- zagon ----------
  uporabiJezik();
  const iskanje = new URLSearchParams(location.search);
  if (iskanje.get('koda')) {
    shraniKodo(iskanje.get('koda').toUpperCase());
    history.replaceState(null, '', location.pathname);
  }
  let obnovaGesla = /type=recovery/.test(location.hash);

  // Klici Supabase ne smejo teči neposredno v onAuthStateChange, zato setTimeout
  sb.auth.onAuthStateChange((dogodek, seja) => {
    setTimeout(async () => {
      const prej = uporabnik;
      uporabnik = seja ? seja.user : null;
      if (menjamGeslo) return;
      if (dogodek === 'PASSWORD_RECOVERY' || (obnovaGesla && seja)) { obnovaGesla = false; menjamGeslo = true; korakObnove(3); pokazi('v-novogeslo'); return; }
      if (!uporabnik) {
        trenutna = null;
        nastaviNacin(false); pokazi('v-dobro');
        sporoci('dobro-sporocilo', kodaCaka() ? t('kodaCaka') : '');
        return;
      }
      if (dogodek === 'SIGNED_IN' && prej && prej.id === uporabnik.id) return;
      if (dogodek === 'SIGNED_IN' || dogodek === 'INITIAL_SESSION') {
        if (!menjamGeslo) await pozdravi(uporabnik);
        const k = vzemiKodo();
        if (k) { await obdelajKodo(k); } else if (!trenutna) { naloziDomove(); }
      }
    }, 0);
  });
  setTimeout(() => { if (!trenutniPogled) { nastaviNacin(false); pokazi('v-dobro'); } }, 6000);
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (_) {} }
})();
</script>
</body>
</html>
